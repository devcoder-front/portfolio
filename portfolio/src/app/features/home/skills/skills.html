<section id="skills" class="section skills" aria-labelledby="skills-heading">
  <div class="section-inner">
    <app-section-heading
      headingId="skills-heading"
      eyebrow="Toolbox"
      title="Skills &amp; Technologies"
      subtitle="A decade-deep Angular and React stack, from frontend architecture and Java-based API integration to performance engineering and AI-assisted delivery."
    />

    <div class="skills__grid">
      @for (group of skills; track group.category; let i = $index) {
        <div class="skills__card" appReveal appSpotlight [appRevealDelay]="i * 60">
          <div class="skills__card-header">
            <span class="skills__card-icon">
              <app-icon [name]="iconFor(group.category)" [size]="18" />
            </span>
            <h3>{{ group.category }}</h3>
          </div>
          <ul class="skills__chips">
            @for (item of group.items; track item) {
              <li><app-chip>{{ item }}</app-chip></li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
